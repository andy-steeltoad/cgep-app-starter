# .github/workflows/grc-gate.yml
name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write       # required for AWS OIDC + Cosign keyless (Lab 4.4)
  contents: read
  pull-requests: write  # required to comment on the PR

concurrency:                       # queue runs instead of failing on the lock
  group: terraform-state-acme-health-intake
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin conftest

      - name: Install tfsec
        run: |
          curl -fsSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec && chmod +x /usr/local/bin/tfsec

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false -backend-config=backend.hcl
          terraform validate
          terraform plan -out=tfplan -input=false -no-color | tee plan.txt

      # Same gate as deploy.yml: scripts/policy-gate.sh is the single
      # source for the policy namespaces. Writes evidence/conftest-results.json.
      - name: Conftest policy gate
        id: conftest
        run: bash scripts/policy-gate.sh --workspace "$TF_WORKING_DIR" --policy policies

      - name: tfsec scan
        id: tfsec
        if: always()
        run: |
          # Write SARIF for the artifact, then re-run with a severity floor so
          # tfsec's own exit code is the gate (no JSON parsing required).
          tfsec "$TF_WORKING_DIR" --format sarif --out evidence/tfsec.sarif || true
          tfsec "$TF_WORKING_DIR" --minimum-severity HIGH

      - name: Copy plan into evidence
        if: always()
        run: |
          cp "$TF_WORKING_DIR"/plan.json evidence/plan.json
          cp "$TF_WORKING_DIR"/plan.txt  evidence/plan.txt

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-evidence-${{ github.run_id }}
          path: evidence
          retention-days: 90
      # Bundles plan, state, commit and the evidence/ folder (Conftest + tfsec
      # results), signs it with Cosign keyless, and stores both in the same
      # Object Lock vault deploy.yml uses. PR runs go under runs/, deploys
      # under deployments/.
      - name: Upload evidence to vault (Object Lock)
        if: ${{ !cancelled() }}
        run: |
          VAULT=$(terraform -chdir="$TF_WORKING_DIR" output -raw evidence_vault_bucket)
          RECEIPT=$(bash scripts/capture-evidence.sh \
            --workspace "$TF_WORKING_DIR" \
            --run-id "${{ github.run_id }}-${{ github.run_attempt }}" \
            --vault "$VAULT" \
            --evidence-dir evidence \
            --sign \
            --verify-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF")
          echo "$RECEIPT"
          { echo '### Evidence vault receipt'; echo '```json'; echo "$RECEIPT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
